services:
  attacker-web:
    image: ${ECR_REGISTRY}/attacker-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 15s
      retries: 3
